# Officine Gặp — public website. Existing Render service retained.
services:
  - type: web
    name: arte-anteprima
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - officinegap.com
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index, follow
    routes:
      - type: redirect
        source: /about/*
        destination: /#practice
