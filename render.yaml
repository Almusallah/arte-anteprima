# Officine Gặp — public website on Render.
services:
  - type: web
    name: arte-anteprima
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - officinegap.com
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index, follow
    routes:
      - type: redirect
        source: "/writing-and-research"
        destination: "/lab/#the-city-otherwise"
      - type: redirect
        source: "/reinterpreting-narrowness*"
        destination: "/lab/#narrowness"
      - type: redirect
        source: "/crafting-a-sonic-city*"
        destination: "/lab/#casc"
      - type: redirect
        source: "/tuar*"
        destination: "/lab/#turtle-lake"
      - type: redirect
        source: "/-g%E1%BA%B7p-series-pop"
        destination: "/lab/#gap-series"
      - type: redirect
        source: "/talks-and-symposia*"
        destination: "/lab/"
      - type: redirect
        source: "/collaborations*"
        destination: "/lab/#counter-gestures"
      - type: redirect
        source: "/about*"
        destination: "/#practice"
