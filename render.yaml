# Officine Gặp — public website on Render.
services:
  - type: web
    name: arte-anteprima
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - officinegap.com
    headers:
      - path: /*
        name: X-Robots-Tag
        value: index, follow
    routes:
      - type: redirect
        source: "/production"
        destination: "/production/"
      - type: redirect
        source: "/lab"
        destination: "/"
      - type: redirect
        source: "/lab/"
        destination: "/"
      - type: redirect
        source: "/writing-and-research"
        destination: "/#the-city-otherwise"
      - type: redirect
        source: "/reinterpreting-narrowness*"
        destination: "/#narrowness"
      - type: redirect
        source: "/crafting-a-sonic-city*"
        destination: "/#casc"
      - type: redirect
        source: "/tuar*"
        destination: "/#turtle-lake"
      - type: redirect
        # Match the retired Gặp Series URL with either encoded or decoded accents.
        source: "/-g*"
        destination: "/#gap-series"
      - type: redirect
        source: "/talks-and-symposia*"
        destination: "/"
      - type: redirect
        source: "/collaborations*"
        destination: "/#counter-gestures"
      - type: redirect
        source: "/about*"
        destination: "/#about"
      - type: redirect
        source: "/mobile-projects*"
        destination: "/"
      - type: redirect
        source: "/contact-form*"
        destination: "/#contact"
